<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты | Мир космоса</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <header class="main-header">
        <div class="logo">
            <i class="fas fa-rocket"></i>
            <h1>Мир космоса</h1>
        </div>
        <nav>
            <ul class="flex-nav">
                <li><a href="index.html"><i class="fas fa-home"></i> Главная</a></li>
                <li><a href="gallery.html"><i class="fas fa-images"></i> Галерея</a></li>
                <li><a href="contacts.html" class="active"><i class="fas fa-envelope"></i> Контакты</a></li>
            </ul>
        </nav>
    </header>

    <main class="contacts-wrapper">
        <div class="info-card">
            <h3><i class="fas fa-user-astronaut"></i> Арабян Артём</h3>
            <p><i class="fas fa-envelope"></i> artem_arabyan@mail.ru</p>
            <p><i class="fas fa-globe"></i> Тема: Космос, астрономия, NASA</p>
            <div class="socials">
                <a href="#"><i class="fab fa-telegram"></i> Telegram</a>
                <a href="#"><i class="fab fa-vk"></i> VK</a>
                <a href="#"><i class="fab fa-instagram"></i> Instagram</a>
            </div>
            <p><i class="fas fa-map-marker-alt"></i> Москва, Россия</p>
        </div>

        <form class="contact-form" id="contactForm">
            <h3>Написать мне</h3>
            <div class="form-group">
                <input type="text" id="name" placeholder="Ваше имя" required>
            </div>
            <div class="form-group">
                <input type="email" id="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <select id="topic">
                    <option>Вопрос о космосе</option>
                    <option>Сотрудничество</option>
                    <option>Другое</option>
                </select>
            </div>
            <div class="form-group">
                <textarea id="message" rows="4" placeholder="Сообщение" required></textarea>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="agree" required>
                <label for="agree">Согласен на обработку данных</label>
            </div>
            <button type="submit" class="btn-primary">Отправить</button>
            <div id="formMessage" class="form-message"></div>
        </form>
    </main>

    <footer class="main-footer">
        <p>Арабян Артем, студент 1 курса, 2026</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
